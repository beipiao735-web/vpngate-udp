name: gate-udp node check

# 手动触发 + 每 30 分钟自动跑一次（UTC 时间，避开整点高峰）
# 志愿者节点寿命短、失效快，刷新越勤，用户拉到的名单越新鲜、死节点越少。
# 注意：GitHub 定时任务通常会延迟几分钟；仓库连续 60 天无活动会被自动停用。
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-udp
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 纯标准库脚本，不需要 pip install，也不需要任何 Secret
      - name: Fetch, classify and probe nodes
        env:
          COUNTRIES: 'KR,JP,TW,HK,SG,VN,TH,MY,PH,ID,AU,US'
          MAX_PER_COUNTRY: '10'
        run: python fetch_udp.py

      # SSTP 版：真实 MS-SSTP 握手探测，产出 public/sstp/nodes.txt（edgetunnel 订阅格式）
      - name: Fetch and SSTP-probe nodes
        env:
          COUNTRIES: 'KR,JP,TW,HK,SG,VN,TH,MY,PH,ID,AU,US'
        run: python fetch_sstp.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
